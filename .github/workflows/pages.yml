# 部署静态演示站到 GitHub Pages（https://2432antony-13.github.io/data-trace/）
# 直接部署仓库中已构建好的 site/：
#   · daily-regulatory-update.yml 每日重建 site/（含新抓取法规）并提交 → 触发本工作流
#   · 本地修改前端/数据后：cd data-trace && npm run build:demo 再提交
name: Deploy static demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate built demo
        run: node --check site/app.js && node --check site/static-data.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
