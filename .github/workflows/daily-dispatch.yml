name: Daily Dispatch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatch configuration
        id: config
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
          DISPATCH_API_KEY: ${{ secrets.DISPATCH_API_KEY }}
          DISPATCH_ENABLED: ${{ vars.DISPATCH_ENABLED }}
        run: |
          if [[ "$DISPATCH_ENABLED" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "## Briefing delivery inactive" >> "$GITHUB_STEP_SUMMARY"
            echo "No message was prepared or delivered. Configure the backend and secrets, verify an authorized test recipient, then set DISPATCH_ENABLED=true." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Briefing delivery is inactive; no outbound request made."
          elif [[ -z "$DISPATCH_URL" || -z "$DISPATCH_API_KEY" ]]; then
            echo "::error::Dispatch is enabled but DISPATCH_URL or DISPATCH_API_KEY is missing."
            exit 1
          elif [[ "$DISPATCH_URL" != https://* ]]; then
            echo "::error::DISPATCH_URL must use HTTPS."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare daily briefing
        if: steps.config.outputs.ready == 'true'
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
          DISPATCH_API_KEY: ${{ secrets.DISPATCH_API_KEY }}
        run: |
          SCHEDULED_AT="$(date -u +%Y-%m-%dT00:00:00Z)"
          BODY="$(printf '{"messageType":"daily_briefing","scheduledAt":"%s"}' "${SCHEDULED_AT}")"
          RESP_FILE="$(mktemp)"
          trap 'rm -f "$RESP_FILE"' EXIT
          HTTP_CODE="$(curl --max-time 60 -sS -o "$RESP_FILE" -w '%{http_code}' \
            -X POST "${DISPATCH_URL%/}/api/dispatch/messages" \
            -H 'content-type: application/json' \
            -H "x-dispatch-key: $DISPATCH_API_KEY" -d "$BODY")"
          if [[ "$HTTP_CODE" =~ ^2 ]] || jq -e '.alreadyPrepared == true' "$RESP_FILE" >/dev/null; then
            echo "Briefing preparation accepted (HTTP $HTTP_CODE). Delivery and receipt need separate evidence." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Briefing preparation failed (HTTP $HTTP_CODE)."
            exit 1
          fi
